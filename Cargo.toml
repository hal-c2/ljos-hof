[workspace]
resolver = "3"
members = ["crates/*"]
# ljos-ui is a workspace of its own; its crates inherit from it, not us.
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hal-c2/ljos-hof"
publish = false

[workspace.dependencies]
# The VT engine: Ghostty's libghostty-vt through its Rust bindings, pinned
# for the semantic-prompt, notification and progress callbacks.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "575ed6b8ceb79ffaf247ecf7e34333876b0d5be4" }
# The UI toolkit, through its facade only (`mise run setup` makes the link).
ljos = { path = "third_party/ljos-ui/crates/ljos", default-features = false }
hof_vt = { path = "crates/hof_vt" }
hof_qml = { path = "crates/hof_qml" }
hof_config = { path = "crates/hof_config" }
hof_mcp = { path = "crates/hof_mcp" }
hof_session = { path = "crates/hof_session" }
hof_remote = { path = "crates/hof_remote" }
hof_agent = { path = "crates/hof_agent" }
rustix = { version = "1.1", features = ["pty", "process", "termios", "fs", "stdio", "event", "system"] }
bitflags = "2.13"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
clap = { version = "4.6", features = ["derive"] }
# Watches the config file, so a save is applied as Hof runs.
notify = "8.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# The VT parser is the hot path even in a debug build. Its build script
# builds Ghostty's Zig in Debug mode whenever cargo says DEBUG, which any
# debug info does (line tables too): several times slower, so none here.
[profile.dev.package.libghostty-vt-sys]
opt-level = 3
debug = false

[profile.release.package.libghostty-vt-sys]
debug = false

# `hof-agent`, as Hof copies it to other machines: small, so the copy is
# quick over a slow link.
[profile.agent]
inherits = "release"
debug = false
strip = true
