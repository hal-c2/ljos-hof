# Ljós Hof configuration.
#
# Copy this to ~/.config/hof/hof.toml (or $XDG_CONFIG_HOME/hof/hof.toml, or
# wherever $HOF_CONFIG points). Every key is optional and every value below
# is the default, so delete whatever you do not change. Keys this version of
# Hof does not know are reported and ignored.

[font]
# A family, or several separated by commas, tried in turn. "monospace" is
# what fontconfig chooses on Linux and Menlo on macOS. Prompt symbols come
# from an installed Nerd Font when none of these is one.
family = "monospace"
size = 11.0                   # size in points
line-height = 1.0             # line height as a multiple of the font's own
bold-is-bright = false        # draw bold text in the bright ANSI colour

[window]
padding = 6.0                 # space around the cells, in logical pixels
opacity = 1.0                 # background opacity, 0 (clear) to 1 (opaque)
pane-border = 2.0             # line round each pane of a split, the focused
                              # one's in a highlight colour; 0 for none
pane-radius = 8.0             # roundness of its corners; 0 for square
decorations = true            # ask for a title bar and borders
width = 100                   # initial width, in cells
height = 30                   # initial height, in cells
title = "Hof"                 # title until the running program sets one
menu = "auto"                 # where the menu of Hof's actions is: "bar" (the
                              # system's on macOS, else atop the window),
                              # "button" (at the end of the tab bar, which is
                              # then always shown), "none", or "auto": the bar
                              # on macOS, the button elsewhere. Every pane has
                              # a right-click menu too.

[terminal]
# shell = "/usr/bin/fish"     # program to run; unset means $SHELL, then /bin/sh
args = []                     # arguments for the program
scrollback = 10000            # lines of scrollback per pane
cursor-blink = true           # blink the cursor
cursor-shape = "block"        # block, bar or underline
copy-on-select = true         # copy to the clipboard as soon as text is selected
confirm-unsafe-paste = true   # ask before pasting newlines or control codes
clipboard-read = "ask"        # programs reading the clipboard (OSC 52):
                              # "ask", "allow" or "deny"
clipboard-write = true        # let programs put text on the clipboard
open-urls = "ask"             # programs opening URLs and files here:
                              # "ask", "allow" or "deny". `hof open` you
                              # run in a pane isn't asked about, unless "deny"
# working-directory = "~/src" # where new terminals start; unset means Hof's own
                              # working directory

[terminal.env]                # extra environment variables for the program
# EDITOR = "nvim"

[theme]
name = "hof-dark"             # hof-dark, hof-light, solarized-dark, solarized-light,
                              # gruvbox-dark, nord, dracula, tokyo-night,
                              # catppuccin-mocha, or <name> for themes/<name>.toml
                              # beside this file (same colour keys as below)
# foreground = "#e8e2d4"      # override the text colour (#rrggbb or #rrggbbaa)
# background = "#0e1219"      # override the background colour
# cursor = "#f2a93b"          # override the cursor colour
# selection = "#2a3446"       # override the selection colour
# palette = ["#1b212c", "#e0625a"] # override the first ANSI colours, up to 16

[dropdown]                    # the window that slides in from a screen edge
height = 0.4                  # fraction of the screen height, above 0 up to 1
width = 1.0                   # fraction of the screen width, above 0 up to 1
position = "top"              # top or bottom
hide-on-focus-loss = true     # hide when another window takes focus
animation-ms = 150            # length of the slide in milliseconds; 0 for none

[keys]
# action = "chord", an array of chords, or "none" to unbind. Modifiers are
# ctrl, shift, alt and super; keys are single characters or enter, tab,
# space, escape, backspace, delete, insert, home, end, pageup, pagedown,
# up, down, left, right, plus, minus, menu, print, pause and f1 to f35.
# super is the logo key, and Command on a Mac (cmd works too); alt is
# Option there. Setting an action replaces all of its default chords. The
# defaults, off macOS:
#
# new-tab = "ctrl+shift+t"
# close-tab = "none"
# next-tab = ["ctrl+tab", "ctrl+pagedown"]
# previous-tab = ["ctrl+shift+tab", "ctrl+pageup"]
# split-right = "ctrl+shift+enter"
# split-down = "ctrl+shift+minus"
# close-pane = "ctrl+shift+w"
# focus-left = "ctrl+shift+left"
# focus-right = "ctrl+shift+right"
# focus-up = "ctrl+shift+up"
# focus-down = "ctrl+shift+down"
# grow-left = "ctrl+alt+shift+left"
# grow-right = "ctrl+alt+shift+right"
# grow-up = "ctrl+alt+shift+up"
# grow-down = "ctrl+alt+shift+down"
# zoom-pane = "ctrl+shift+m"
# copy = "ctrl+shift+c"
# paste = ["ctrl+shift+v", "shift+insert"]
# select-all = "none"
# scroll-page-up = "shift+pageup"
# scroll-page-down = "shift+pagedown"
# scroll-top = "shift+home"
# scroll-bottom = "shift+end"
# previous-prompt = "ctrl+shift+z"
# next-prompt = "ctrl+shift+x"
# font-bigger = ["ctrl+plus", "ctrl+="]
# font-smaller = "ctrl+minus"
# font-reset = "ctrl+0"
# search = "ctrl+shift+f"
# reset = "none"
# reload-config = "ctrl+shift+r"
# toggle-dropdown = "none"
# toggle-fullscreen = "f11"
# minimize = "none"
# maximize = "none"
# next-waiting = "ctrl+shift+a"
# new-tab-on-host = "ctrl+shift+h"
# split-right-on-host = "none"
# split-down-on-host = "none"
# focus-next = "none"
# focus-previous = "none"
# tab-1 = "alt+1"
# tab-2 = "alt+2"
# tab-3 = "alt+3"
# tab-4 = "alt+4"
# tab-5 = "alt+5"
# tab-6 = "alt+6"
# tab-7 = "alt+7"
# tab-8 = "alt+8"
# last-tab = "alt+9"
# edit-config = "none"
# settings = "ctrl+shift+,"
# quit = "ctrl+shift+q"
#
# On macOS, where Command is the application's and every Ctrl and Option
# chord the terminal's:
#
#   new-tab = "cmd+t"
#   close-tab = "cmd+alt+w"
#   next-tab = ["ctrl+tab", "cmd+shift+right"]
#   previous-tab = ["ctrl+shift+tab", "cmd+shift+left"]
#   split-right = "cmd+d"
#   split-down = "cmd+shift+d"
#   close-pane = "cmd+w"
#   focus-left = "cmd+alt+left"
#   focus-right = "cmd+alt+right"
#   focus-up = "cmd+alt+up"
#   focus-down = "cmd+alt+down"
#   grow-left = "cmd+ctrl+left"
#   grow-right = "cmd+ctrl+right"
#   grow-up = "cmd+ctrl+up"
#   grow-down = "cmd+ctrl+down"
#   zoom-pane = "cmd+shift+enter"
#   copy = "cmd+c"
#   paste = "cmd+v"
#   select-all = "cmd+a"
#   scroll-page-up = ["shift+pageup", "cmd+pageup"]
#   scroll-page-down = ["shift+pagedown", "cmd+pagedown"]
#   scroll-top = ["shift+home", "cmd+home"]
#   scroll-bottom = ["shift+end", "cmd+end"]
#   previous-prompt = "cmd+up"
#   next-prompt = "cmd+down"
#   font-bigger = ["cmd+plus", "cmd+="]
#   font-smaller = "cmd+minus"
#   font-reset = "cmd+0"
#   search = "cmd+f"
#   reset = "none"
#   reload-config = "cmd+shift+r"
#   toggle-dropdown = "none"
#   toggle-fullscreen = "cmd+ctrl+f"
#   minimize = "cmd+m"
#   maximize = "none"
#   next-waiting = "cmd+shift+a"
#   new-tab-on-host = "cmd+shift+h"
#   split-right-on-host = "none"
#   split-down-on-host = "none"
#   focus-next = "cmd+]"
#   focus-previous = "cmd+["
#   tab-1 = "cmd+1"
#   tab-2 = "cmd+2"
#   tab-3 = "cmd+3"
#   tab-4 = "cmd+4"
#   tab-5 = "cmd+5"
#   tab-6 = "cmd+6"
#   tab-7 = "cmd+7"
#   tab-8 = "cmd+8"
#   last-tab = "cmd+9"
#   edit-config = "cmd+shift+,"
#   settings = "cmd+,"
#   quit = "cmd+q"

[session]
restore = false               # reopen the last session's windows, tabs and panes;
                              # kept as Hof runs, so a crash loses little
save-scrollback = true        # keep each pane's scrollback with the saved session
keep-running = true           # with restore: panes' programs run on when Hof
                              # closes, under `hof agent`, and are attached again
# host = "desktop"            # a plain `hof` keeps its session on this [hosts]
                              # host: opened as left there, its programs run on
                              # there (`hof attach --host` for one window)
# name = "work"               # the session a plain `hof` keeps, not `default`;
                              # a host may name its own: [hosts.NAME] session

# Desktop notifications, by `notify-send`.
[notify]
agent-waiting = true          # an agent you can't see starts waiting for you

# The Model Context Protocol server for agents. Give an agent `hof mcp` as
# the command of a stdio server: it speaks for the running Hof.
[mcp]
enabled = false               # run the server
# socket = "~/.hof.sock"      # socket to listen on; unset means one in
                              # $XDG_RUNTIME_DIR
allow-input = false           # let agents type and run commands in panes
allow-spawn = false           # let agents open and close tabs and panes

# Your own commands, each run at a key. `run` is a shell snippet (run by
# `sh -c`) or a list, the program and its arguments; `in` is where it runs:
# "tab", "split-right", "split-down" or "background". Or `send` types text
# into the focused pane instead. A command's keys take the place of a
# default binding with the same chord, but not of one in [keys].
#
# [commands.top]
# run = ["htop"]
# in = "split-down"
# keys = "ctrl+alt+t"
# description = "What is running"
#
# [commands.status]
# send = "git status\n"
# keys = "ctrl+alt+g"

# Shell snippets run in the background when something happens in a pane,
# a string or a list of them. Each gets HOF_EVENT, HOF_PANE_ID, HOF_SOCKET
# (so it can drive Hof with `hof ctl`) and HOF_DIRECTORY, and what the
# event says: HOF_EXIT_CODE and HOF_COMMAND for commands (with shell
# integration), HOF_TITLE and HOF_BODY for titles and notifications,
# HOF_AGENT and HOF_AGENT_STATE for agents.
#
# [hooks]
# pane-opened = []
# pane-closed = []
# command-started = []
# command-finished = '[ "$HOF_EXIT_CODE" = 0 ] || notify-send "failed: $HOF_COMMAND"'
# bell = []
# notification = 'notify-send "$HOF_TITLE" "$HOF_BODY"'
# directory-changed = []
# title-changed = []
# agent-changed = '[ "$HOF_AGENT_STATE" = idle ] && notify-send "$HOF_AGENT is done"'

# Plugins are files in a `plugins` directory beside this one, with
# [commands.<name>], [hooks] and [agents.<name>] as here:
# `plugins/<name>.toml`, or `plugins/<name>/plugin.toml` for one that keeps
# scripts beside it, which its programs find in HOF_PLUGIN_DIR. Your own commands win over a
# plugin's; a [commands.<name>] here with only `keys` rebinds a plugin's.
[plugins]
disabled = []                 # plugins, by name, to leave unloaded

# Other machines panes can run on. Hof reaches each through `ssh`, which
# runs `hof agent --stdio` there; the agent keeps the panes running when
# the connection drops, and Hof picks them up again when it comes back.
#
# [hosts.dev]
# ssh = "dev.example.com"     # anything ssh takes; empty means the name
# user = "me"                 # log in as; empty means ssh's choice
# port = 2222                 # connect to; unset means ssh's choice (22)
# ssh-options = []            # more for ssh: ["-o", "ForwardAgent=yes"]
# command = []                # reach the agent with this instead of ssh
# hof = "hof"                 # the Hof to run there
# bootstrap = true            # with no Hof there, copy Hof's agent over ssh
# x11 = false                 # let programs there open X11 windows here:
#                             # through yserver on a Mac when it is installed,
#                             # else the X server $DISPLAY names
# sound = false               # let programs there play sound here: through
#                             # the PulseAudio or PipeWire running here, else,
#                             # on a Mac, Hof itself, nothing to install
# files = false               # mount that machine's files here as soon as
#                             # it is reached, at $XDG_RUNTIME_DIR/hof/
#                             # hosts/<name> (Linux); else the first time
#                             # `hof open DIR` there wants it
# clipboard = "ask"           # programs there reading your clipboard:
#                             # "ask", "allow" or "deny"
# session = "work"            # the session a plain `hof` keeps there, with
#                             # [session] host = this host; else [session] name

# AI agents in panes. Hof tells one runs by the program in the foreground,
# and how it is by the text on the bottom rows of its screen: "waiting"
# for you, "working", or else "idle". The tab shows it, a hook hears it,
# and a waiting agent out of sight sends a notification. Hof ships tables
# for claude, codex, gemini, aider and opencode; one here replaces Hof's
# of the same name. An agent can also say how it is itself, from its own
# hooks: `hof ctl agent-state waiting`.
#
# [agents.claude]
# process = ["claude"]        # its program's names; empty means the table's
# waiting = ["Do you want to"]
# working = ["esc to interrupt"]
