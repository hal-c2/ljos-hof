[package]
name = "hof_remote"
description = "Hof's remote panes: the wire between Hof and `hof agent`, and streams that survive a dropped connection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
rustix = { workspace = true, features = ["net"] }

# `getpeereid`, which rustix lacks, for the sockets' peers off Linux.
[target.'cfg(not(target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
