[package]
name = "hof_remote"
description = "Hof's remote panes: the wire between Hof and `hof agent`, and streams that survive a dropped connection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
rustix = { workspace = true, features = ["net"] }

# The other machine's files, mounted here: through `fusermount3`, with
# no libfuse.
[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.18", default-features = false }

# `getpeereid`, which rustix lacks, for the sockets' peers off Linux.
[target.'cfg(not(target_os = "linux"))'.dependencies]
libc = "0.2"

# The speakers Hof's own sound server plays through, on a Mac.
[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.18", optional = true }

[features]
# Hof's own sound server, for a machine with none: on a Mac.
speakers = ["dep:cpal"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
