# Tooling for Ljós Hof. `mise install` installs it; tasks live in mise-tasks/.
[settings]
# Pinned tools' bin dirs go first on PATH, so `mise run` builds with rustup's pinned toolchain
# even where a system rust (e.g. /usr/bin/cargo) or an inherited mise env comes first.
activate_aggressive = true

[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# libghostty-vt is built from Ghostty's source by its build script.
zig = "0.17.1"

[env]
CARGO_TERM_COLOR = "always"
